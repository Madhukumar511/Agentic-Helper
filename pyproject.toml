[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-helper"
version = "1.1.0"
description = "Universal LMS & Browser Automation Engine for Autonomous AI Agents (Coursera, Canvas, Moodle, Blackboard, Google Forms)"
readme = "README.md"
authors = [{ name = "Madhukumar", email = "madhukumar511@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "websockets>=12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "numpy>=1.24.0",
    "pillow>=9.0.0",
    "opencv-python-headless>=4.8.0"
]

[project.scripts]
agentic-helper = "quiz_pilot.cli:main"
agentic-helper-mcp = "quiz_pilot.mcp_server:run_mcp_server"
quiz-pilot = "quiz_pilot.cli:main"
