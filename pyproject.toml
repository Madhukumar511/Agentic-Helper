[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-helper"
version = "1.0.0"
description = "Universal LMS & Browser Automation Engine for Autonomous AI Agents (Coursera, Canvas, Moodle, Blackboard, etc.)"
readme = "README.md"
authors = [{ name = "Madhukumar", email = "madhukumar511@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "websockets>=12.0",
    "google-genai>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0"
]

[project.scripts]
agentic-helper = "quiz_pilot.cli:main"
quiz-pilot = "quiz_pilot.cli:main"
